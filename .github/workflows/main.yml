name: Build POErim

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_binary_cache,readwrite"

    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_binary_cache
          key: vcpkg-${{ hashFiles('vcpkg.json', 'grid/plugin/vcpkg.json') }}
          restore-keys: vcpkg-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'grid/plugin/vcpkg.json'
          runVcpkgInstall: false

      - name: Configure
        run: >
          cmake -B build -S . -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build plugin and harness
        run: cmake --build build --config Release --target DiabloInSkyrim RollHarness

      # Grid Inventory, POErim's build (grid/). Its own vcpkg manifest and
      # build folder; installed over the Nexus Grid Inventory.
      - name: Configure Grid Inventory
        run: >
          cmake -B build-grid -S grid/plugin -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DVCPKG_MANIFEST_DIR="${{ github.workspace }}/grid/plugin"

      - name: Build Grid Inventory
        run: cmake --build build-grid --config Release

      - name: Run the roll harness
        shell: pwsh
        run: |
          $harness = "build/Release/RollHarness.exe"
          & $harness data/DiabloLoot_affixes.csv --merge data/DiabloLoot_affixes_implicits.csv --samples 20000 --levels 1,25,40
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Fixed checks: Regal refusals, bit-identical refusals, Chaos counts,
          # co-save round trip (0/1/2 implicits, corrupted), difficulty mean.
          & $harness data/DiabloLoot_affixes.csv --merge data/DiabloLoot_affixes_implicits.csv --merge data/DiabloLoot_affixes_summermyst.csv --selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out = & $harness data/DiabloLoot_affixes.csv --merge data/DiabloLoot_affixes_implicits.csv --craft "transmute,augment,regal,exalt*3,chaos*50,divine,vaal" --levels 1,25,34,39,40 --chains 5000
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out
          if ($out -match "<-- BUG") { Write-Error "an orb broke a rule"; exit 1 }
          $out = & $harness data/DiabloLoot_affixes.csv --merge data/DiabloLoot_affixes_implicits.csv --craft "transmute,augment,regal,exalt*3,vaal,vaal,divine,scour,chaos" --level 40 --chains 20000 --vaal-keep
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($out -match "<-- BUG") { $out; Write-Error "the Vaal chain broke a rule"; exit 1 }
          & $harness --drops --levels 1,20,50 --samples 20000 > drops_default.txt
          & $harness --drops --levels 1,20,50 --samples 20000 --drop-mult 1.0 > drops_m1.txt
          if ((Get-FileHash drops_default.txt).Hash -ne (Get-FileHash drops_m1.txt).Hash) {
            Write-Error "--drop-mult 1.0 is not byte-identical to no multiplier"; exit 1
          }
          & $harness --drops --levels 20 --samples 20000 --drop-mult 1.75
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check the plugin is the one the generator makes
        shell: pwsh
        run: |
          python tools/esp/build_esp.py build/DiabloInSkyrim.esp
          if ((Get-FileHash build/DiabloInSkyrim.esp).Hash -ne (Get-FileHash data/DiabloInSkyrim.esp).Hash) {
            Write-Error "data/DiabloInSkyrim.esp is stale: run python tools/esp/build_esp.py"; exit 1
          }

      - name: Package
        shell: pwsh
        run: |
          $plugins = "dist/SKSE/Plugins"
          New-Item -ItemType Directory -Force -Path $plugins | Out-Null
          Copy-Item build/Release/DiabloInSkyrim.dll $plugins
          Copy-Item data/DiabloLoot.ini $plugins
          Copy-Item data/DiabloLoot_affixes.csv $plugins
          New-Item -ItemType Directory -Force -Path dist-optional/SKSE/Plugins | Out-Null
          Copy-Item data/DiabloLoot_affixes_summermyst.csv dist-optional/SKSE/Plugins
          New-Item -ItemType Directory -Force -Path dist-tools | Out-Null
          Copy-Item build/Release/RollHarness.exe dist-tools
          Copy-Item build/Release/DiabloInSkyrim.pdb dist-tools -ErrorAction SilentlyContinue
          Copy-Item data/DiabloLoot_affixes.csv dist-tools
          Copy-Item data/DiabloLoot_affixes_implicits.csv $plugins
          Copy-Item data/DiabloInSkyrim.esp dist
          $gridDll = Get-ChildItem build-grid -Recurse -Filter GridInventory.dll | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $gridDll) { Write-Error "GridInventory.dll was not built"; exit 1 }
          Copy-Item $gridDll.FullName $plugins
          $gridPdb = Get-ChildItem build-grid -Recurse -Filter GridInventory.pdb | Select-Object -First 1
          if ($gridPdb) { Copy-Item $gridPdb.FullName dist-tools }
          New-Item -ItemType Directory -Force -Path "$plugins/GridInventory_fallback/item" | Out-Null
          Copy-Item data/GridInventory_fallback/item/*.png "$plugins/GridInventory_fallback/item"
          New-Item -ItemType Directory -Force -Path dist/textures/DiabloInSkyrim/orbs | Out-Null
          Copy-Item data/textures/DiabloInSkyrim/orbs/*.dds dist/textures/DiabloInSkyrim/orbs

      - name: Upload mod (Vortex-installable)
        uses: actions/upload-artifact@v4
        with:
          name: POErim
          path: dist/

      - name: Upload Summermyst add-on (optional, Vortex-installable)
        uses: actions/upload-artifact@v4
        with:
          name: POErim-Summermyst-Affixes
          path: dist-optional/

      - name: Upload tools (roll harness, PDB)
        uses: actions/upload-artifact@v4
        with:
          name: POErim-Tools
          path: dist-tools/
