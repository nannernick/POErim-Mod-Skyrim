name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_binary_cache,readwrite"

    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_binary_cache
          key: vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-

      - name: Setup vcpkg (pinned to vcpkg.json baseline)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'
          runVcpkgInstall: false

      - name: Configure
        run: >
          cmake -B build -S . -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DMOD_ROOT=none

      - name: Build
        run: cmake --build build --config Release

      - name: Roller harness smoke test
        shell: bash
        run: |
          exe=$(find build -name RollHarness.exe | head -n 1)
          "$exe" data/DiabloLoot_affixes.csv --samples 2000 --seed 1 > harness.txt
          tail -n 20 harness.txt

      - name: Package (Vortex data-root layout)
        shell: bash
        run: |
          out=dist/SKSE/Plugins
          mkdir -p "$out"
          cp "$(find build -name DiabloInSkyrim.dll | head -n 1)" "$out/"
          cp data/*.csv "$out/"
          cp data/DiabloLoot.ini "$out/DiabloLoot.ini.default"

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: DiabloInSkyrim
          path: dist/
